<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup: Hero entrance A / B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" />
<style>
  :root { --brew:#7b3e0d; --espresso:#2a1608; --caramel:#e9c9a8; --ink:#33200f; --line:#e4d6c7; --ease:cubic-bezier(.2,.7,.2,1); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Poppins, sans-serif; color:var(--ink); background:var(--espresso); line-height:1.65; overflow-x:hidden; }
  img { display:block; max-width:100%; }
  h1, p { margin:0; }
  .wrap { width:min(1160px, 100% - 32px); margin-inline:auto; }

  header { position:relative; z-index:2; background:#fff; border-bottom:1px solid var(--line); }
  header .wrap { display:flex; justify-content:space-between; align-items:center; height:68px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.15rem; color:var(--brew); }
  .brand img { height:36px; }
  header nav { display:flex; gap:28px; font-weight:500; font-size:.95rem; }

  .hero { position:relative; isolation:isolate; overflow:hidden; color:#fff; min-height:calc(100vh - 68px);
    display:grid; align-items:center; padding-block:clamp(56px, 9vw, 120px);
    background:var(--espresso); }
  .hero-bg { position:absolute; inset:0; z-index:-2; width:100%; height:100%; object-fit:cover; }
  .hero::before { content:''; position:absolute; inset:0; z-index:-1;
    background:linear-gradient(90deg, rgb(42 22 8 / .92), rgb(42 22 8 / .78) 45%, rgb(42 22 8 / .45)),
               linear-gradient(0deg, rgb(42 22 8 / .6), transparent 40%); }
  .inner { display:grid; grid-template-columns:1fr 1.1fr; gap:clamp(32px, 5vw, 64px); align-items:center; }
  .kicker { font-weight:600; color:var(--caramel); margin-bottom:12px; }
  h1 { font-size:clamp(2.6rem, 6vw + .5rem, 4.75rem); font-weight:800; line-height:1; letter-spacing:-.035em; }
  .text { margin-top:20px; max-width:34ch; font-size:1.125rem; color:rgb(255 255 255 / .82); }
  .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; }
  .btn { display:inline-flex; align-items:center; min-height:48px; padding:12px 24px; border-radius:999px; font-weight:600; text-decoration:none; }
  .b1 { background:#fff; color:var(--espresso); }
  .b2 { border:1.5px solid rgb(255 255 255 / .4); color:#fff; }
  .media { border-radius:24px; overflow:hidden; outline:2px solid var(--caramel); outline-offset:10px;
    box-shadow:0 24px 60px rgb(0 0 0 / .5), 0 0 90px rgb(233 201 168 / .22); }
  .media img { width:100%; aspect-ratio:4/3; object-fit:cover; }

  /* each word sits in a mask and slides up from behind its bottom edge */
  .m { display:inline-block; overflow:hidden; vertical-align:top; padding-bottom:.12em; margin-bottom:-.12em; }
  .m > span { display:inline-block; }

  /* ---------- Entrance (A = the hero itself; B adds the logo curtain first) ---------- */
  @keyframes fade-zoom { from { opacity:0; transform:scale(1.15); } }
  @keyframes word-up { from { transform:translateY(110%); } }
  @keyframes rise { from { opacity:0; transform:translateY(24px); } }
  @keyframes photo-in { from { opacity:0; transform:translateX(48px) scale(.96); } }
  @keyframes ring-in { from { outline-color:transparent; outline-offset:28px; } }
  @keyframes header-in { from { opacity:0; transform:translateY(-100%); } }
  @keyframes logo-in { from { opacity:0; transform:scale(.8); } }
  @keyframes curtain-up { to { transform:translateY(-100%); } }
  @keyframes tag-in { from { opacity:0; letter-spacing:.3em; } }

  .play { --d:0s; }
  .play.b { --d:1.7s; }  /* A's sequence starts once the curtain is lifting */
  .play .hero-bg { animation:fade-zoom 2s calc(var(--d) + 0s) var(--ease) both; }
  .play h1 .m:nth-child(1) > span { animation:word-up .8s calc(var(--d) + .35s) var(--ease) both; }
  .play h1 .m:nth-child(2) > span { animation:word-up .8s calc(var(--d) + .43s) var(--ease) both; }
  .play h1 .m:nth-child(3) > span { animation:word-up .8s calc(var(--d) + .51s) var(--ease) both; }
  .play h1 .m:nth-child(4) > span { animation:word-up .8s calc(var(--d) + .59s) var(--ease) both; }
  .play h1 .m:nth-child(5) > span { animation:word-up .8s calc(var(--d) + .67s) var(--ease) both; }
  .play h1 .m:nth-child(6) > span { animation:word-up .8s calc(var(--d) + .75s) var(--ease) both; }
  .play .kicker  { animation:rise .7s calc(var(--d) + .2s) var(--ease) both; }
  .play .text    { animation:rise .7s calc(var(--d) + .95s) var(--ease) both; }
  .play .actions { animation:rise .7s calc(var(--d) + 1.1s) var(--ease) both; }
  .play .media   { animation:photo-in 1s calc(var(--d) + .7s) var(--ease) both, ring-in .8s calc(var(--d) + 1.5s) var(--ease) both; }
  .play header   { animation:header-in .6s calc(var(--d) + 1.3s) var(--ease) both; }

  .curtain { position:fixed; inset:0; z-index:5; display:none; place-items:center; background:var(--espresso); cursor:pointer; }
  .curtain div { display:grid; justify-items:center; gap:16px; }
  .curtain img { width:clamp(110px, 18vw, 160px); filter:brightness(0) invert(.88) sepia(.4); }
  .curtain p { color:var(--caramel); font-weight:600; letter-spacing:.08em; }
  .play.b .curtain { display:grid; animation:curtain-up .9s 1.4s cubic-bezier(.7,0,.2,1) forwards; }
  .play.b .curtain img { animation:logo-in .7s .1s var(--ease) both; }
  .play.b .curtain p { animation:tag-in .9s .4s var(--ease) both; }
  .skip .curtain { display:none !important; }
  .skip * { animation-delay:0s !important; animation-duration:.01s !important; }

  /* mockup controls */
  .switch { position:fixed; right:16px; bottom:16px; z-index:10; display:flex; gap:4px; padding:4px; background:#fff; border-radius:999px; box-shadow:0 4px 20px rgb(0 0 0 / .3); }
  .switch button { border:0; font:inherit; font-size:.85rem; font-weight:600; padding:8px 14px; border-radius:999px; background:none; color:#6e5847; cursor:pointer; }
  .switch button[aria-pressed='true'] { background:var(--brew); color:#fff; }

  @media (max-width:900px) {
    .inner { grid-template-columns:1fr; }
    header nav { display:none; }
    .media { outline-offset:6px; }
    .hero::before { background:linear-gradient(180deg, rgb(42 22 8 / .9), rgb(42 22 8 / .7)); }
    .hero-bg { display:none; }
    .hero { background:url('/videos/coffee-poster.jpg') center / cover, var(--espresso); }
  }
</style>
</head>
<body>
<div id="stage" class="play">
  <div class="curtain" title="Click to skip">
    <div>
      <img src="/images/logo.png" alt="" />
      <p>Sip something uniquely good</p>
    </div>
  </div>

  <header><div class="wrap">
    <div class="brand"><img src="/images/logo.png" alt="" />Mr. Brew</div>
    <nav><span>Menu</span><span>Our story</span><span>Events</span><span>Visit</span></nav>
  </div></header>

  <section class="hero">
    <video class="hero-bg" src="/videos/coffee.mp4" poster="/videos/coffee-poster.jpg" autoplay muted loop playsinline aria-hidden="true"></video>
    <div class="wrap inner">
      <div>
        <p class="kicker">Mr. Brew Tea &amp; Coffee House</p>
        <h1><span class="m"><span>Where</span></span> <span class="m"><span>every</span></span> <span class="m"><span>cup</span></span> <span class="m"><span>tells</span></span> <span class="m"><span>a</span></span> <span class="m"><span>story</span></span></h1>
        <p class="text">Premium tea and coffee, brewed daily for every Ka-brew. Coffee, milk tea and good food served fresh in Tetuan, Zamboanga City.</p>
        <div class="actions"><a class="btn b1" href="#">See the menu</a><a class="btn b2" href="#">Book the coffee cart</a></div>
      </div>
      <div class="media"><img src="/images/drinks-tray.jpg" alt="" /></div>
    </div>
  </section>
</div>

<div class="switch" role="group" aria-label="Pick an entrance">
  <button data-v="a" aria-pressed="true">A · Hero</button>
  <button data-v="b" aria-pressed="false">B · Logo intro</button>
  <button data-v="replay">↻ Replay</button>
</div>

<script>
  const stage = document.getElementById('stage');
  let v = 'a';
  function play() {
    stage.className = '';
    void stage.offsetWidth; // restart the animations
    stage.className = 'play ' + v;
  }
  document.querySelector('.curtain').onclick = () => stage.classList.add('skip');
  document.querySelectorAll('.switch button').forEach((b) => b.onclick = () => {
    if (b.dataset.v !== 'replay') {
      v = b.dataset.v;
      document.querySelectorAll('[data-v="a"],[data-v="b"]').forEach((x) => x.setAttribute('aria-pressed', x === b));
    }
    play();
  });
  play();
</script>
</body>
</html>
